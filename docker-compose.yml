# ============================================================================
# EchoFlow - Docker Compose Configuration
# Repository: https://github.com/GGLVXD/EchoFlow
# 
# Quick Start:
#   1. cp .env.example .env
#   2. Edit .env with your API keys
#   3. docker-compose up -d
#
# Documentation: See README.md for detailed setup instructions
# ============================================================================

version: '3.8'

services:
  # PHP-FPM Application Server
  app:
    image: php:8.2-fpm-alpine
    container_name: echoflow_app
    working_dir: /var/www/html
    restart: unless-stopped
    
    environment:
      GENIUS_KEY: '${GENIUS_KEY}'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: '${REDIS_PASSWORD}'
      REDIS_DATABASE: '${REDIS_DATABASE:-0}'
    
    depends_on:
      - redis
    
    networks:
      - internal
    
    volumes:
      - app_data:/var/www/html
    
    command:
      - sh
      - -c
      - |
        apk add --no-cache unzip git
        curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
        
        if [ ! -f /var/www/html/composer.json ]; then
          git clone https://github.com/GGLVXD/EchoFlow.git /var/www/html
        fi
        
        cd /var/www/html
        
        cat > .env <<ENVEOF
        GENIUS_KEY=$$GENIUS_KEY
        REDIS_HOST=$$REDIS_HOST
        REDIS_PORT=$$REDIS_PORT
        REDIS_PASSWORD=$$REDIS_PASSWORD
        REDIS_DATABASE=$$REDIS_DATABASE
        ENVEOF
        
        composer install --no-interaction
        php-fpm
    
    healthcheck:
      test: ["CMD", "sh", "-c", "echo 'PING' | nc -w 1 localhost 9000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: echoflow_nginx
    restart: unless-stopped
    
    ports:
      - "${NGINX_PORT:-80}:80"
    
    depends_on:
      - app
    
    networks:
      - internal
    
    hostname: echoflow
    
    volumes:
      - app_data:/var/www/html:ro
    
    command:
      - sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen 80;
          server_name _;
          root /var/www/html;
          index index.php;
          
          location / {
            try_files $$uri $$uri/ /index.php?$$query_string;
          }
          
          location /lyrics/ {
            try_files $$uri $$uri/ /lyrics/index.php?$$query_string;
          }
          
          location ~ \.php$$ {
            include fastcgi_params;
            fastcgi_pass app:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $$document_root$$fastcgi_script_name;
          }
          
          location ~ /\.env {
            deny all;
          }
        }
        EOF
        nginx -g 'daemon off;'
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Redis Cache Server
  redis:
    image: redis:7-alpine
    container_name: echoflow_redis
    restart: unless-stopped
    
    environment:
      REDIS_PASSWORD: '${REDIS_PASSWORD}'
    
    command: sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD"'
    
    volumes:
      - redis_data:/data
    
    networks:
      - internal
    
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  app_data: {}
  redis_data: {}

networks:
  internal:
    internal: true
